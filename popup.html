<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xdebug Helper</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <form id="popup">
        <label>
            <input type="radio" name="state" value="1">
            <span class="icon icon-debug"></span> Debug
        </label>
        <label>
            <input type="radio" name="state" value="2">
            <span class="icon icon-profile"></span> Profile
        </label>
        <label>
            <input type="radio" name="state" value="3">
            <span class="icon icon-trace"></span> Trace
        </label>
        <label>
            <input type="radio" name="state" value="0">
            <span class="icon icon-disable"></span> Disable
        </label>
        <a href="#" id="options">options</a>
    </form>
    <script src="popup.js"></script>
</body>
</html>
